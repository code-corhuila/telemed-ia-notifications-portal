worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/javascript;
  server_tokens off;

  # A remote only: the shell loads remoteEntry.json and the ./mount bundle.
  # There is no index.html; anything else is 404.
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Federation metadata must always be fresh and readable by the shell.
    location ~ ^/(remoteEntry|importmap)\.json$ {
      include /etc/nginx/security-headers.conf;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Bundle names carry a content hash.
    location ~* \.js$ {
      include /etc/nginx/security-headers.conf;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      return 404;
    }
  }
}
